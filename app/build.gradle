plugins {
    id 'com.android.application'
}

android {
    namespace 'com.latchi.play'
    compileSdk 35

    defaultConfig {
        applicationId 'com.latchi.play'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.1.0'
    }

    def keystorePath = System.getenv('CM_KEYSTORE_PATH')
    def keystorePassword = System.getenv('CM_KEYSTORE_PASSWORD')
    def keyAliasValue = System.getenv('CM_KEY_ALIAS')
    def keyPasswordValue = System.getenv('CM_KEY_PASSWORD')

    signingConfigs {
        if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
