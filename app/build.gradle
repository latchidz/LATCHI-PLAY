plugins {
    id 'com.android.application'
}

android {
    namespace 'com.latchi.play'
    compileSdk 35

    defaultConfig {
        applicationId 'com.latchi.play'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '3.1.0'
    }

    def keystorePath = System.getenv('CM_KEYSTORE_PATH')
    def keystorePassword = System.getenv('CM_KEYSTORE_PASSWORD')
    def keyAliasValue = System.getenv('CM_KEY_ALIAS')
    def keyPasswordValue = System.getenv('CM_KEY_PASSWORD')

    signingConfigs {
        if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
            release {
                storeFile file(keystorePath)
                storeType 'PKCS12'
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
