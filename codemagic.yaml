workflows:
  android-debug-apk:
    name: LATCHI PLAY - APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Verify environment
        script: |
          java -version
          chmod +x gradlew
          ./gradlew --version
      - name: Build installable APK
        script: |
          ./gradlew clean :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/LATCHI-PLAY.apk"
    artifacts:
      - LATCHI-PLAY.apk
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**/*

  android-release-aab:
    name: LATCHI PLAY - Play Store AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - android_signing
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Build signed release bundle
        script: |
          set -e
          : "${CM_KEYSTORE:?Add CM_KEYSTORE to the android_signing group}"
          : "${CM_KEYSTORE_PASSWORD:?Add CM_KEYSTORE_PASSWORD to the android_signing group}"
          : "${CM_KEY_ALIAS:?Add CM_KEY_ALIAS to the android_signing group}"
          : "${CM_KEY_PASSWORD:?Add CM_KEY_PASSWORD to the android_signing group}"
          export CM_KEYSTORE_PATH="$CM_BUILD_DIR/release.keystore"
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew clean :app:bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab "$CM_BUILD_DIR/LATCHI-PLAY-release.aab"
    artifacts:
      - LATCHI-PLAY-release.aab
      - app/build/outputs/bundle/release/*.aab
      - app/build/reports/**/*
